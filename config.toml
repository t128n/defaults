[settings]
lockfile = true
dotfiles.windows_symlinks = true
self_update.auto = true

[tools]
# Runtimes
bun = "1.4"
node = "24"
uv = "0.13"

# Shell & utilities
fd = "latest"
gh = "latest"
ghq = "latest"
hyperfine = "latest"
jq = "latest"
ripgrep = "latest"
starship = "latest"
yq = "latest"
"npm:@oxide/skepsis" = "latest"

# Development tools
gitleaks = "latest"
hk = "latest"
"npm:portless" = "latest"

# AI engineering
"github:anomalyco/hex" = "latest"
opencode = "latest"

# Agent tools
"npm:@ghfs/cli" = "latest"
"npm:agent-browser" = "latest"
"npm:agent-desktop" = "latest"
"npm:webreel" = "latest"
"npm:deepsec" = "latest"
"npm:lat.md" = "latest"
"npm:opensrc" = "latest"
"npm:skills" = "latest"


[dotfiles]
"~/.gitconfig" = { source = "git/gitconfig", mode = "symlink" }
"~/.gitconfig-identity" = { source = "git/identity.example", mode = "copy", create_if_missing = true }
"~/.config/starship.toml" = { source = "starship/starship.toml", mode = "symlink" }
"~/.config/opencode" = { source = "opencode", mode = "symlink-each" }
